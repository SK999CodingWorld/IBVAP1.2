name: Validate deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run API and domain tests
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
          WEBHOOK_SECRET: ci-only-webhook-secret-with-at-least-32-characters
          DATABASE_URL: sqlite+aiosqlite:///./ibvap-ci.db
          DB_SSL: 'false'
          DEMO_MODE: 'true'
          ENABLE_BACKGROUND_WORKERS: 'false'
          TESTING: '1'
        run: python -m pytest backend/tests tests -v

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
