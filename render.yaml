services:
  - type: web
    name: ibvap-api
    env: docker
    dockerfilePath: ./Dockerfile.prod
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: DB_SSL
        value: "true"
      - key: ENABLE_BACKGROUND_WORKERS
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      # Add these in the Render dashboard. They are intentionally not stored in Git.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
